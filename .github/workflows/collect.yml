name: Weekend collection

# Collection runs seven days a week; delivery runs five (answers doc Q6). On weekdays
# the digest workflow does the collecting, so this only covers Saturday and Sunday —
# that way Monday's 72-hour digest is drawn from state that was gathered as the
# weekend happened, not scraped in one cold burst on Monday morning.
on:
  schedule:
    - cron: "0 5 * * 6,0"
    - cron: "0 6 * * 6,0"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the local-time gate"
        type: boolean
        default: false

concurrency:
  group: ba-radar-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Should this run collect?
        id: gate
        run: uv run ba-radar gate --hour 8 --any-day ${{ inputs.force && '--force' || '' }}

      - name: Collect
        if: steps.gate.outputs.proceed == 'true'
        env:
          # Not exported to `run` steps automatically: without this the GitHub sources
          # go unauthenticated (60 requests/hour per IP) and fail with 403. See D-17.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoring and analysis run inside `collect` (Stage 2). Only the provider
          # selected in config/settings.yaml needs its key; the other may stay unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run ba-radar collect

      - name: Apply retention policy
        if: steps.gate.outputs.proceed == 'true'
        run: uv run ba-radar prune

      - name: Commit state
        if: steps.gate.outputs.proceed == 'true'
        run: ./.github/scripts/commit-state.sh "weekend collection"
