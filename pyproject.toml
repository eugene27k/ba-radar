[project]
name = "ba-radar"
version = "0.1.0"
description = "Monitors AI-native development sources and delivers a daily digest to Telegram"
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
ba-radar = "ba_radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ba_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:ba_radar.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3 flag Cyrillic and typographic punctuation as "ambiguous unicode". The
# digest is written in Ukrainian and the title normaliser has to match real curly
# quotes and dashes, so these fire on correct code throughout.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true
