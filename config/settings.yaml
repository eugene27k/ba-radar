# Tunable behaviour. No secrets here — those come from the environment only (PRD §8).
# Stage 5 tuning happens in this file plus config/sources.yaml; neither needs a redeploy.

schedule:
  timezone: Europe/Kyiv
  # Target hours are not configured here. They live in .github/workflows/*.yml, next
  # to the cron lines that must agree with them — a value here would silently drift.
  # How far past the target hour a delayed GitHub Actions run is still allowed to
  # deliver. 59 => anything within the 08:xx Kyiv hour proceeds (answers doc Q22).
  gate_tolerance_minutes: 59

collection:
  concurrency: 10
  request_timeout_seconds: 15
  max_retries: 3              # PRD 1.1.9 — 3 retries after the initial attempt
  retry_interval_seconds: 5   # PRD 1.1.9
  per_source_deadline_seconds: 60
  max_items_per_source: 20    # PRD 1.1.10
  default_lookback_hours: 48  # PRD 1.1.5 — used when no cursor exists
  max_lookback_hours: 72      # answers doc Q15 — hard clamp after an outage
  # Re-read this far behind the cursor so an entry added to a feed late, with a
  # published date older than the newest already seen, is still collected. Re-reading
  # is free: identity dedup makes a second sighting a no-op. See DECISIONS.md D-16.
  cursor_overlap_hours: 24
  hn_requery_hours: 72        # answers doc Q11
  global_item_cap: 300        # answers doc Q20
  user_agent: "ba-radar/0.1 (+https://github.com/eugene27k/ba-radar)"
  host_min_interval_seconds:
    hn.algolia.com: 0.5

normalize:
  excerpt_max_chars: 2000
  # answers doc Q16 — this list is the spec, not a provisional default.
  strip_params_exact:
    - ref
    - referrer
    - source
    - src
    - fbclid
    - gclid
    - msclkid
    - twclid
    - igshid
    - mc_cid
    - mc_eid
    - _hsenc
    - _hsmi
    - hsctatracking
    - ck_subscriber_id
  strip_params_prefix:
    - utm_
    - at_
  # http -> https is forced only for hosts the registry already reaches over https,
  # plus anything listed here.
  force_https_hosts: []
  resolve_redirect_hosts:
    - t.co
    - bit.ly
    - buff.ly
    - lnkd.in
    - ow.ly
    - dlvr.it
    - feedproxy.google.com
    - "*.feedburner.com"
    - link.substack.com
    - "*.substack.com"
    - link.mail.beehiiv.com
    - "*.beehiiv.com"
  redirect_max_hops: 3
  redirect_timeout_seconds: 5

dedupe:
  title_window_days: 14       # answers doc Q12

# Scoring (Stage 2). The model returns a base score; the rules below adjust it, and
# the bands turn the adjusted score into a tier. See DECISIONS.md D-19 and D-25.
scoring:
  threshold: 40               # PRD 2.1.5, applied to the adjusted score (Q7)
  no_tag_penalty: 20          # PRD 2.1.7
  multi_source_bonus: 15      # PRD 1.2.5, applied during scoring (Q7)
  multi_source_min: 3
  indicator_bonus:            # answers doc Q18
    leading: 5
    mixed: 0
    lagging: -5
  bands:                      # answers doc Q8 — rule-derived priority
    critical: 75
    notable: 55
    background: 40
  analysis_cap: 40            # answers doc Q20

digest:
  caps:                       # PRD 2.3.2–2.3.4
    critical: 3
    notable: 5
    background: 7
  # Bold first line of every message. Matches the channel name (@AIforBARadar);
  # change it here, not in code. See DECISIONS.md D-24.
  header_title: "AIforBA Radar"
  # Items a failed or timed-out provider left without a verdict are still delivered,
  # in a final «Без аналізу» block capped here — an outage must be visible in the
  # channel, never silently dropped. Replaces Increment 1's stage1_max_items.
  # See DECISIONS.md D-20, D-21.
  unscored_max_items: 30
  # Analysed items that did not fit under the caps roll over to later digests for
  # this long, measured from the moment they were collected. See DECISIONS.md D-21.
  rollover_hours: 72
  telegram_max_chars: 4096    # PRD 3.1.7
  # A batch whose send keeps failing is retried on following days, up to this many
  # days back, instead of being orphaned. See DECISIONS.md D-15.
  pending_resend_days: 3

retention:
  full_rows_days: 90          # answers doc §0 — then prune to id + url
  runs_days: 90               # PRD 4.2.7

# Model provider and task -> model routing (Stage 2).
#
# `provider` is the default for every task; a task may override it with its own
# `provider`. Switching providers is a config edit here plus a secret in the
# environment (ANTHROPIC_API_KEY / OPENAI_API_KEY) — never a code change. Only the
# provider a configured task uses needs a key; `collect` fails fast if it is missing.
#
# Model choice is quality first (the verdict is the product): Claude Sonnet 5 for
# both tasks. The relevance filter is irreversible — an item scored below the
# threshold is never re-scored because its excerpt is gone — so it gets the same model
# as the analysis. `claude-haiku-4-5` is the cheaper alternative for `relevance`;
# note that it does not accept `effort`.
#
# `max_tokens` is generous on purpose: Claude Sonnet 5 runs adaptive thinking by
# default and thinking tokens count against the limit, so a tight budget truncates
# the JSON. Only generated tokens are billed.
llm:
  provider: anthropic
  # Wall-clock budget for each model phase (scoring, then analysis). Past it, the
  # remaining items stay unscored, the run is DEGRADED and the digest shows them in
  # «Без аналізу». Keeps a hanging provider inside the 10-minute cycle NFR.
  phase_deadline_seconds: 240
  request_timeout_seconds: 120
  concurrency: 4              # parallel requests within a phase
  tasks:
    relevance:
      model: claude-sonnet-5
      max_tokens: 16000
      batch_size: 20          # PRD 2.1.3 — prompt batching, not the Batches API (Q1)
      # effort: medium        # low | medium | high (default) | xhigh | max
    analysis:
      model: claude-sonnet-5
      max_tokens: 8000
    weekly:                   # not used in Stage 2 (weekly digest is a later stage)
      model: claude-sonnet-5
      max_tokens: 4000
      effort: high
  # OpenAI example. Uncomment, put the model you want to use (model IDs are taken
  # from https://developers.openai.com/api/docs/models — verify the name there, and
  # confirm the setup with `uv run ba-radar llm-check --task relevance`), and set
  # OPENAI_API_KEY. Per-task overrides let one task stay on Anthropic.
  # provider: openai
  # tasks:
  #   relevance:
  #     provider: openai
  #     model: gpt-5.6-terra     # read from the docs on 2026-09-07; not yet verified live
  #     max_tokens: 16000
  #     batch_size: 20
  #     effort: medium           # reasoning.effort; omit for non-reasoning models
  #   analysis:
  #     provider: openai
  #     model: gpt-5.6-terra
  #     max_tokens: 8000
  # USD per million tokens, for the cost estimate in the run log only. Add a row for
  # any other model you route to; unknown models report "n/a".
  pricing:
    claude-sonnet-5: {input_per_mtok: 2.00, output_per_mtok: 10.00}
    claude-haiku-4-5: {input_per_mtok: 1.00, output_per_mtok: 5.00}
    claude-opus-5: {input_per_mtok: 5.00, output_per_mtok: 25.00}
