# ---------------------------------------------------------------------------
# hn_algolia
# ---------------------------------------------------------------------------

# The PRD's example query, "Claude Code OR spec-driven OR MCP", returns zero results:
# Algolia's `query` is a full-text search, so "OR" is matched as a literal word. Each
# term therefore gets its own search and the results are merged. Quoted phrases are
# used because a bare MCP matches unrelated stories. Measured yield at min_points 50
# on 2026-08-03: "Claude Code" ~3/week, "MCP" ~3/week, "agentic" ~3/week.
# "spec-driven" currently returns nothing but is cheap to keep watching.
- id: hn-agentic
  name: Hacker News — agentic
  method: hn_algolia
  query:
    - '"Claude Code"'
    - '"MCP"'
    - '"agentic"'
    - '"spec-driven"'
  min_points: 50
  category: community
  indicator: leading
  weight: 6
  active: true

# ---------------------------------------------------------------------------
# Stage 3 — inactive until html_diff / github_commits_path ship
# ---------------------------------------------------------------------------

# Anthropic Engineering publishes no RSS/Atom feed (verified 2026-08-03: /rss.xml,
# /news/rss.xml, /feed.xml and /engineering/rss.xml all 404), and the site is not a
# public repo, so html_diff is the only option. Selector needs confirming against the
# live page markup when Stage 3 starts.
- id: anthropic-engineering
  name: Anthropic Engineering
  method: html_diff
  url: https://www.anthropic.com/engineering
  selector: "main"
  category: vendor
  indicator: leading
  weight: 10
  active: false

# 12-factor-agents publishes no GitHub releases at all (verified 2026-08-03: the
# releases endpoint returns an empty array), so github_releases would silently yield
# nothing. It is a content repo, which is what github_commits_path is for.
- id: 12-factor-agents
  name: humanlayer/12-factor-agents
  method: github_commits_path
  repo: humanlayer/12-factor-agents
  path: content
  category: community
  indicator: leading
  weight: 8
  active: false
