# BA Radar source registry (PRD §6, req. 4.1).
#
# This file is the only thing you need to edit to add, remove or disable a source.
# Changes take effect on the next collection run with no redeploy (req. 4.1.6).
#
# Universal required fields: id, name, method, category, indicator, weight, active
# Per-method required fields (answers doc Q3):
#   rss                  -> url
#   github_releases      -> repo
#   github_commits_path  -> repo, path
#   html_diff            -> url, selector
#   hn_algolia           -> query, min_points
#
# category:  vendor | practitioner | newsletter | research | community | ba_source | regional
# indicator: leading | lagging | mixed
# weight:    integer 1..10
#
# Increment 1 implements rss, github_releases and hn_algolia. Sources needing
# html_diff or github_commits_path are present but inactive, with a note; they are
# switched on in Stage 3.
#
# Every URL and repo below was verified to resolve on 2026-08-03.

